<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่องปลาหน้าคุ้น</title>
    <style>
        :root {
            --primary: #e11d48;
            --bg: #fff1f2;
        }
        
        body {
            margin: 0; font-family: 'Kanit', sans-serif;
            background-color: var(--bg);
            color: #333;
        }

        nav {
            background: var(--primary);
            padding: 1rem;
            display: flex; justify-content: center;
            position: fixed; top: 0; width: 100%; z-index: 100;
        }

        nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; cursor: pointer; }

        section {
            height: 100vh; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }

        section.active { display: flex; }

        /* การตกแต่งปุ่มเลือกภาพ */
        .upload-btn {
            background: var(--primary);
            color: white; padding: 15px 30px;
            border-radius: 50px; cursor: pointer;
            font-size: 1.5rem; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(225, 29, 72, 0.4);
        }

        .upload-btn:hover { transform: scale(1.1) rotate(-2deg); background: #be123c; }

        /* รูปภาพที่อัปโหลด */
        #fish-photo {
            max-width: 250px; border: 8px solid white;
            border-radius: 20px; margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            display: none;
        }

        /* กล่องคำด่า */
        #result-card {
            margin-top: 20px; padding: 20px;
            background: white; border-radius: 15px;
            width: 80%; max-width: 400px;
            display: none; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

        #fish-name { font-size: 2.5rem; color: var(--primary); font-weight: 900; }
        #insult-text { font-size: 1.3rem; margin-top: 10px; color: #555; font-style: italic; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<nav>
    <a onclick="showPage('home')">หน้าหลัก</a>
    <a onclick="showPage('check')">ส่องปลา/ส่องเพื่อน</a>
    <a onclick="showPage('about')">คนทำเว็บ</a>
</nav>

<section id="home" class="active">
    <h1>ยินดีต้อนรับสู่ระบบ <br><span style="color:var(--primary)">สแกนปลาหน้าเหมือนเพื่อน</span></h1>
    <p>เอาไว้เช็คว่ารูปที่ถ่ายมา คือปลาหรือหน้าเพื่อนคุณกันแน่!</p>
</section>

<section id="check">
    <h2 id="status-title">เอารูปปลา (หรือรูปเพื่อน) มาดูดิ๊!</h2>
    
    <img id="fish-photo" src="">

    <div id="result-card">
        <div id="fish-name"></div>
        <div id="insult-text"></div>
    </div>

    <div style="margin-top: 30px;">
        <label for="file-in" class="upload-btn">เลือกภาพ</label>
        <input type="file" id="file-in" accept="image/*" style="display:none" onchange="startScan(event)">
    </div>
</section>

<section id="about">
    <h2>เกี่ยวกับผู้จัดทำ</h2>
    <p>สร้างมาเพื่อความบันเทิงในวงเหล้าและหมู่เพื่อนฝูงโดยเฉพาะ</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/kjePmuygi/";
    let model;

    // คลังคำด่าแบบกวนๆ
    const roastData = {
        "Class 1": {
            name: "ปลานิล",
            quotes: [
                "ปลานิลตัวนี้นิ่งมาก นิ่งเหมือนไม่มีสมองเลย",
                "วาสนาปลานิล ได้เกิดมาหน้าคล้ายเพื่อนมึงคนนึง",
                "อย่าทำหน้าเหมือนปลานิลสิ เห็นแล้วอยากเอาไปทอด",
                "ปลานิลตัวนี้ดูมีทรง... ทรงอย่างแบด แซดอย่างมึง!"
            ]
        },
        "Class 2": {
            name: "ปลาหมอ",
            quotes: [
                "ปลาหมอมาแล้วจ้า! เก่งแต่ปากแบบนี้ ไม่ต้องสืบว่าเพื่อนใคร",
                "หน้าตาปลาหมอตัวนี้ ดูแล้วน่าจะเรียนไม่จบนะ",
                "ปลาหมอตายเพราะปาก แต่มึงจะตายเพราะถ่ายรูปนี้",
                "ไม่ต้องทำมาเป็นมองแรง ไอ้ปลาหมอปากเสีย!"
            ]
        },
        "Unknown": {
            name: "ตัวประหลาด",
            quotes: [
                "AI ยังงง! นี่มึงอัปโหลดรูปปลาหรือรูปขยะเนี่ย?",
                "ตัวอะไรวะเนี่ย หน้าตาอุบาทว์จนระบบประมวลผลไม่ได้!",
                "กูว่าไม่ใช่ปลาละ นี่มันสัตว์นรกมาเกิดชัดๆ"
            ]
        }
    };

    async function loadModel() {
        model = await tmImage.load(URL + "model.json", URL + "metadata.json");
    }

    function showPage(id) {
        document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function startScan(event) {
        if (!model) await loadModel();
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const photo = document.getElementById("fish-photo");
        const card = document.getElementById("result-card");

        reader.onload = function(e) {
            photo.src = e.target.result;
            photo.style.display = "block";
            card.style.display = "none";
            document.getElementById("status-title").innerText = "กำลังวิเคราะห์หน้าปลา...";

            photo.onload = async function() {
                const predict = await model.predict(photo);
                const top = predict.reduce((a, b) => (a.probability > b.probability) ? a : b);
                
                let resultData = roastData[top.className] || roastData["Unknown"];
                if (top.probability < 0.4) resultData = roastData["Unknown"];

                const randomQuote = resultData.quotes[Math.floor(Math.random() * resultData.quotes.length)];

                document.getElementById("fish-name").innerText = resultData.name;
                document.getElementById("insult-text").innerText = "คำด่าจาก AI: " + randomQuote;
                card.style.display = "block";
                document.getElementById("status-title").innerText = "วิเคราะห์เสร็จแล้วอีสัส!";
                
                // เสียงด่า (Option เสริม)
                speak("ไอ้" + resultData.name + " " + randomQuote);
            };
        };
        reader.readAsDataURL(file);
    }

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'th-TH';
        window.speechSynthesis.speak(msg);
    }

    loadModel();
</script>

</body>
</html>
